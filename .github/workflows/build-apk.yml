# Workflow ini membuat file APK secara otomatis di server GitHub.
# Berjalan setiap kali ada perubahan di folder aplikasi (branch main),
# atau saat kamu menekan tombol "Run workflow" di tab Actions.

name: Build APK Pakan Ikan

on:
  push:
    branches: [ main ]
    paths:
      - 'aplikasi/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aplikasi

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Ganti nama APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PakanIkan.apk

      - name: Simpan APK sebagai Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PakanIkan-APK
          path: aplikasi/PakanIkan.apk

      - name: Terbitkan APK di halaman Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pakan Ikan build ${{ github.run_number }}
          body: APK otomatis dari commit ${{ github.sha }}. Unduh file PakanIkan.apk di bawah ini.
          files: aplikasi/PakanIkan.apk
          make_latest: true
