<text x="50" y="420" class="h">Catatan penting</text>
<text x="50" y="444" class="c">1. Setel step-down ke 5,0V pakai multimeter SEBELUM</text>
<text x="50" y="468" class="c">    menyambung ESP32 dan servo.</text>
<text x="50" y="492" class="c">2. Semua GND jadi satu: adaptor, step-down, ESP32,</text>
<text x="50" y="516" class="c">    servo, sensor, relay, blower.</text>
<text x="50" y="540" class="c">3. Servo ambil 5V dari step-down, BUKAN dari pin 3V3</text>
<text x="50" y="564" class="c">    atau 5V ESP32.</text>
<text x="50" y="588" class="c">4. ECHO HC-SR04 keluar 5V → turunkan pakai pembagi</text>
<text x="50" y="612" class="c">    tegangan 1kΩ + 2kΩ supaya aman untuk ESP32 (3,3V).</text>
<text x="50" y="636" class="c">5. Jenis relay (aktif HIGH/LOW) dipilih di aplikasi.</text>
<text x="50" y="660" class="c">6. Blower lewat COM–NO relay, +12V dari adaptor.</text>
<text x="50" y="684" class="c">7. Tombol pakai pull-up internal: cukup GPIO23 ↔ GND.</text>
<text x="50" y="708" class="c">8. Tahan tombol 3 detik saat menyalakan alat → mode</text>
<text x="50" y="732" class="c">    hotspot "PakanIkan-Setup" untuk atur WiFi.</text>
<text x="50" y="766" class="h">Warna kabel di gambar</text>
<text x="50" y="790" class="c">Merah = 5V   ·   Merah tua = 12V   ·   Hitam = GND</text>
<text x="50" y="814" class="c">Oranye = sinyal servo   ·   Ungu = sensor jarak</text>
<text x="50" y="838" class="c">Hijau = relay   ·   Kuning = LED   ·   Abu = buzzer/tombol</text>
</svg>