; =====================================================================
;  Pakan Ikan Otomatis v3.9  |  PlatformIO
;  Buka folder ini di VS Code (ekstensi PlatformIO), lalu klik Upload.
; =====================================================================

[platformio]
; Tombol Build/Upload hanya memproses environment ini.
; Untuk upload lewat WiFi, pilih "env:esp32dev_ota" di bilah bawah VS Code.
default_envs = esp32dev

; ---------- Upload lewat kabel USB ----------
[env:esp32dev]
platform = espressif32 @ ^6.9.0
board = esp32dev
framework = arduino

; Partisi 1.9 MB aplikasi + OTA (wajib untuk update lewat WiFi)
board_build.partitions = min_spiffs.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.6
    mobizt/Firebase Arduino Client Library for ESP8266 and ESP32 @ ^4.4.17

build_flags =
    -DCORE_DEBUG_LEVEL=0

; ---------- Upload lewat WiFi (OTA), laptop harus di WiFi yang sama dengan alat ----------
; Pilih environment "esp32dev_ota" di bilah bawah VS Code, lalu Upload.
; Jika "pakan-ikan.local" tidak ditemukan, ganti dengan IP alat (lihat di aplikasi).
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = pakan-ikan.local
; Ganti GANTI_PASSWORD_OTA di bawah dengan OTA_PASSWORD yang kamu isi di include/kredensial.h
upload_flags =
    --auth=GANTI_PASSWORD_OTA
    --port=3232
